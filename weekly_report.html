<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>주간 업무보고 커밋 내역 생성기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 22px; }
  #authBar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 10px 0; font-size: 13px; color: #555; }
  #authBar img { width: 24px; height: 24px; border-radius: 50%; }
  #authBar button { margin: 0; padding: 6px 12px; font-size: 13px; background: #24292f; }
  #authBar button:hover { background: #000; }
  #loggedOutNotice { color: #888; font-size: 13px; margin-top: 4px; }
  label { display: block; margin-top: 12px; font-size: 14px; font-weight: 600; }
  input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font-size: 14px; }
  .repo-row { display: flex; gap: 8px; margin-top: 4px; }
  .repo-row input { margin-top: 0; }
  button { margin-top: 20px; padding: 10px 20px; font-size: 15px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  .browseBtn, .addBtn { margin-top: 0; padding: 8px 14px; font-size: 14px; background: #444; white-space: nowrap; }
  .browseBtn:hover, .addBtn:hover { background: #222; }
  #repoList { list-style: none; padding: 0; margin: 8px 0 0; }
  #repoList li { display: flex; justify-content: space-between; align-items: center; background: #f5f5f5; padding: 6px 10px; border-radius: 6px; margin-top: 6px; font-size: 13px; }
  #repoList li button { margin: 0; padding: 2px 8px; font-size: 12px; background: #b91c1c; }
  #repoList li button:hover { background: #7f1d1d; }
  #repoList .empty { color: #888; font-size: 13px; background: none; padding: 4px 0; }
  #result { margin-top: 24px; border-top: 1px solid #e5e5e5; padding-top: 16px; }
  #result h1, #result h2, #result h3 { margin-top: 20px; }
  #result pre { background: #f5f5f5; padding: 12px; border-radius: 6px; overflow-x: auto; }
  #result code { font-family: Menlo, Consolas, monospace; font-size: 13px; }
  .error { color: #b91c1c; }
  #downloadBtn { display: none; margin-top: 12px; background: #16a34a; }
  #downloadBtn:hover { background: #15803d; }
  #historySection { display: none; margin-top: 20px; }
  #historySection h3 { font-size: 14px; margin: 0 0 6px; }
  #historyList { list-style: none; padding: 0; margin: 0; }
  #historyList li { font-size: 13px; padding: 6px 8px; background: #f5f5f5; border-radius: 6px; margin-top: 4px; cursor: pointer; }
  #historyList li:hover { background: #e5e5e5; }
</style>
</head>
<body>
  <div id="authBar"></div>

  <h1>주간 업무보고 커밋 내역 생성기</h1>
  <p>여러 git 저장소의 최근 커밋을 한번에 모아 보고서 초안을 만들어줍니다.</p>
  <p id="loggedOutNotice">(선택) GitHub로 로그인하면 추후 클라우드 저장 등 부가 기능을 이용할 수 있습니다.</p>

  <div id="mainApp">
    <div id="localRepoSection">
      <label>저장소 경로 추가</label>
      <div class="repo-row">
        <input id="repoInput" list="repoHistory" placeholder="예: C:\Users\User\project 또는 owner/repo (GitHub)">
        <datalist id="repoHistory"></datalist>
        <button class="browseBtn" onclick="browseFolder()">찾아보기</button>
        <button class="addBtn" onclick="addTypedRepo()">추가</button>
      </div>
      <ul id="repoList"></ul>

      <label>작성자 (git author, 선택)</label>
      <input id="author" placeholder="비워두면 전체">
    </div>
    <p id="githubAutoNotice" style="display:none; color:#888; font-size:13px; margin-top:12px;">GitHub 로그인 상태이므로, 접근 가능한 모든 저장소에서 아래 기간 동안 작성한 본인 커밋을 자동으로 가져옵니다.</p>

    <label>시작 날짜</label>
    <input id="since" type="date">

    <label>종료 날짜</label>
    <input id="until" type="date">

    <label>보고서에 표시할 이름 (선택)</label>
    <input id="name" placeholder="예: 홍길동 (비워두면 git 작성자명 사용)">

    <button onclick="generate()">생성</button>
    <button id="downloadBtn" onclick="download()">Markdown 다운로드</button>

    <div id="result"></div>

    <div id="historySection">
      <h3>최근 생성 이력 (클라우드)</h3>
      <ul id="historyList"></ul>
    </div>
  </div>

<script>
const SUPABASE_URL = "https://wjctfmiafwvypmwtnpkn.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqY3RmbWlhZnd2eXBtd3RucGtuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxOTEwNDIsImV4cCI6MjEwMDc2NzA0Mn0.hy62BJuf6u-CaLj52wFjOd4RVYPIAtV6cNhIa25W6cg";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentSession = null;

function renderAuthBar(session) {
  const wasLoggedIn = !!currentSession;
  currentSession = session;
  const bar = document.getElementById('authBar');
  const notice = document.getElementById('loggedOutNotice');
  const historySection = document.getElementById('historySection');
  const localRepoSection = document.getElementById('localRepoSection');
  const githubAutoNotice = document.getElementById('githubAutoNotice');

  if (session && session.user) {
    const meta = session.user.user_metadata || {};
    const avatar = meta.avatar_url ? `<img src="${meta.avatar_url}" alt="avatar">` : "";
    const displayName = meta.user_name || meta.full_name || session.user.email || "사용자";
    bar.innerHTML = `${avatar}<span>${displayName}님</span>`;
    const logoutBtn = document.createElement('button');
    logoutBtn.textContent = '로그아웃';
    logoutBtn.onclick = logout;
    bar.appendChild(logoutBtn);

    notice.style.display = 'none';
    historySection.style.display = 'block';
    localRepoSection.style.display = 'none';
    githubAutoNotice.style.display = 'block';

    if (!wasLoggedIn) {
      syncReposOnLogin();
      loadReportHistory();
    }
  } else {
    bar.innerHTML = "";
    const loginBtn = document.createElement('button');
    loginBtn.textContent = 'GitHub로 로그인';
    loginBtn.onclick = loginWithGithub;
    bar.appendChild(loginBtn);

    notice.style.display = 'block';
    historySection.style.display = 'none';
    localRepoSection.style.display = 'block';
    githubAutoNotice.style.display = 'none';
  }
}

async function loginWithGithub() {
  await supabaseClient.auth.signInWithOAuth({
    provider: 'github',
    options: { redirectTo: window.location.origin }
  });
}

async function logout() {
  await supabaseClient.auth.signOut();
}

supabaseClient.auth.onAuthStateChange((_event, session) => {
  renderAuthBar(session);
});

(async function initAuth() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  renderAuthBar(session);
})();
</script>

<script>
let lastMarkdown = "";

const REPOS_KEY = "wr_repos";
const REPO_HISTORY_KEY = "wr_repo_history";
const REPO_HISTORY_MAX = 20;

let repos = JSON.parse(localStorage.getItem(REPOS_KEY) || "[]");
let repoHistory = JSON.parse(localStorage.getItem(REPO_HISTORY_KEY) || "[]");

function saveRepos() {
  localStorage.setItem(REPOS_KEY, JSON.stringify(repos));
}

function rememberRepoHistory(path) {
  repoHistory = [path, ...repoHistory.filter(p => p !== path)].slice(0, REPO_HISTORY_MAX);
  localStorage.setItem(REPO_HISTORY_KEY, JSON.stringify(repoHistory));
  renderRepoHistory();
}

function renderRepoHistory() {
  const list = document.getElementById('repoHistory');
  list.innerHTML = "";
  repoHistory.forEach(path => {
    const option = document.createElement('option');
    option.value = path;
    list.appendChild(option);
  });
}

function renderRepoList() {
  const ul = document.getElementById('repoList');
  ul.innerHTML = "";
  if (repos.length === 0) {
    ul.innerHTML = '<li class="empty">추가된 저장소가 없습니다.</li>';
    return;
  }
  repos.forEach((r, i) => {
    const li = document.createElement('li');
    const span = document.createElement('span');
    span.textContent = r;
    const btn = document.createElement('button');
    btn.textContent = '삭제';
    btn.onclick = () => {
      repos.splice(i, 1);
      saveRepos();
      renderRepoList();
      if (currentSession) removeCloudRepo(r);
    };
    li.appendChild(span);
    li.appendChild(btn);
    ul.appendChild(li);
  });
}

function addRepo(path) {
  if (path && !repos.includes(path)) {
    repos.push(path);
    saveRepos();
    rememberRepoHistory(path);
    renderRepoList();
    if (currentSession) addCloudRepo(path);
  }
}

// ---------- 로그인 시 클라우드(Supabase) 저장소 목록 동기화 ----------

async function addCloudRepo(path) {
  try {
    await supabaseClient.from('saved_repos').insert({ user_id: currentSession.user.id, repo: path });
  } catch (e) {
    console.error('클라우드 저장소 저장 실패', e);
  }
}

async function removeCloudRepo(path) {
  try {
    await supabaseClient.from('saved_repos').delete().eq('user_id', currentSession.user.id).eq('repo', path);
  } catch (e) {
    console.error('클라우드 저장소 삭제 실패', e);
  }
}

async function syncReposOnLogin() {
  const { data, error } = await supabaseClient.from('saved_repos').select('repo').order('created_at');
  if (error) {
    console.error('클라우드 저장소 조회 실패', error);
    return;
  }
  const cloudRepos = data.map(r => r.repo);

  // 로컬에만 있던 저장소는 클라우드로 올려준다
  const localOnly = repos.filter(r => !cloudRepos.includes(r));
  for (const r of localOnly) {
    await addCloudRepo(r);
  }

  repos = [...new Set([...cloudRepos, ...repos])];
  saveRepos();
  renderRepoList();
}

// ---------- 생성 이력 (클라우드) ----------

async function saveReportToCloud(markdown, since, until) {
  try {
    await supabaseClient.from('reports').insert({
      user_id: currentSession.user.id, markdown, since: since || null, until: (until || '').slice(0, 10) || null
    });
    loadReportHistory();
  } catch (e) {
    console.error('이력 저장 실패', e);
  }
}

async function loadReportHistory() {
  const { data, error } = await supabaseClient
    .from('reports')
    .select('id, markdown, since, until, created_at')
    .order('created_at', { ascending: false })
    .limit(5);
  if (error) {
    console.error('이력 조회 실패', error);
    return;
  }
  const list = document.getElementById('historyList');
  list.innerHTML = "";
  if (data.length === 0) {
    list.innerHTML = '<li style="cursor:default;">아직 생성 이력이 없습니다.</li>';
    return;
  }
  data.forEach(r => {
    const li = document.createElement('li');
    const created = new Date(r.created_at).toLocaleString('ko-KR');
    li.textContent = `${r.since || '?'} ~ ${r.until || '?'} (${created})`;
    li.onclick = () => {
      lastMarkdown = r.markdown;
      document.getElementById('result').innerHTML = marked.parse(r.markdown);
      document.getElementById('downloadBtn').style.display = 'inline-block';
    };
    list.appendChild(li);
  });
}

function addTypedRepo() {
  const input = document.getElementById('repoInput');
  addRepo(input.value.trim());
  input.value = "";
}

async function browseFolder() {
  try {
    const res = await fetch('/browse');
    const data = await res.json();
    if (data.path) {
      addRepo(data.path);
    }
  } catch (e) {
    alert('폴더 선택창을 열 수 없습니다: ' + e);
  }
}

async function generate() {
  const since = document.getElementById('since').value;
  const untilRaw = document.getElementById('until').value;
  // until 날짜는 그날 23:59:59까지 포함되도록 처리
  const until = untilRaw ? untilRaw + " 23:59:59" : "";
  const author = document.getElementById('author').value;
  const name = document.getElementById('name').value;
  const result = document.getElementById('result');
  const githubToken = currentSession?.provider_token || null;

  if (!githubToken && repos.length === 0) {
    result.innerHTML = '<p class="error">저장소를 하나 이상 추가해주세요.</p>';
    return;
  }

  result.innerHTML = "생성 중...";

  try {
    const body = githubToken
      ? { mode: 'github_auto', since, until, name, github_token: githubToken }
      : { repos, since, until, author, name };
    const res = await fetch('/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (data.error) {
      result.innerHTML = '<p class="error">' + data.error + '</p>';
      document.getElementById('downloadBtn').style.display = 'none';
      return;
    }
    lastMarkdown = data.markdown;
    result.innerHTML = marked.parse(data.markdown);
    document.getElementById('downloadBtn').style.display = 'inline-block';
    if (currentSession) saveReportToCloud(data.markdown, since, until);
  } catch (e) {
    result.innerHTML = '<p class="error">오류: ' + e + '</p>';
  }
}

function download() {
  const blob = new Blob([lastMarkdown], {type: 'text/markdown'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'weekly_report.md';
  a.click();
}

function isoDate(d) {
  return d.toISOString().slice(0, 10);
}

(function setDefaultDates() {
  const today = new Date();
  const weekAgo = new Date();
  weekAgo.setDate(today.getDate() - 7);
  document.getElementById('since').value = isoDate(weekAgo);
  document.getElementById('until').value = isoDate(today);
})();

renderRepoList();
renderRepoHistory();
</script>
</body>
</html>
