<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>커밋 전쟁 시뮬레이터</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #0b0f1a; color: #eee; }
  #hud { position: fixed; top: 0; left: 0; right: 0; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); z-index: 10; }
  #hud h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #hud a { color: #9ca3af; font-size: 12px; text-decoration: none; }
  #legend { position: fixed; top: 48px; left: 16px; font-size: 13px; z-index: 10; }
  #legend .row { display: flex; align-items: center; gap: 6px; margin-top: 4px; background: rgba(15,20,30,0.55); backdrop-filter: blur(4px); padding: 5px 10px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
  #legend .row.dead { opacity: 0.4; text-decoration: line-through; }
  #legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; box-shadow: 0 0 6px currentColor; }
  #log { position: fixed; bottom: 0; left: 0; right: 0; max-height: 160px; overflow-y: auto; background: rgba(10,14,22,0.7); backdrop-filter: blur(6px); padding: 10px 16px; font-size: 13px; line-height: 1.6; z-index: 10; }
  #log .winner { color: #fbbf24; font-weight: 700; }
  #status { position: fixed; top: 48px; right: 16px; font-size: 13px; z-index: 10; color: #9ca3af; }
  canvas { display: block; }
</style>
</head>
<body>
  <div id="hud">
    <h1>⚔️ 커밋 전쟁 시뮬레이터</h1>
    <a href="/">돌아가기</a>
  </div>
  <div id="loginGate" style="display:none; position:fixed; inset:0; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:#0b0f1a; z-index:20;">
    <p>GitHub 로그인이 필요합니다.</p>
    <button onclick="loginWithGithub()" style="padding:10px 20px; font-size:15px; background:#24292f; color:#fff; border:none; border-radius:6px; cursor:pointer;">GitHub로 로그인</button>
  </div>
  <div id="legend"></div>
  <div id="status">불러오는 중...</div>
  <div id="log"></div>

<script>
const SUPABASE_URL = "https://wjctfmiafwvypmwtnpkn.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqY3RmbWlhZnd2eXBtd3RucGtuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxOTEwNDIsImV4cCI6MjEwMDc2NzA0Mn0.hy62BJuf6u-CaLj52wFjOd4RVYPIAtV6cNhIa25W6cg";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const COLORS = [0xef4444, 0x3b82f6, 0xf59e0b, 0xa855f7, 0x06b6d4, 0xec4899, 0xeab308, 0x22c55e];
const MAX_UNITS_PER_EMPIRE = 40; // 성능을 위한 상한
const UNIT_SPEED = 1.6;          // 초당 이동 거리
const COLLIDE_DIST = 0.4;
const BATTLEFIELD_RADIUS = 11;
const CASTLE_RADIUS = BATTLEFIELD_RADIUS + 3;
const ENGAGE_RADIUS = 3.2;       // 중앙에서 이 거리 안으로 들어오면 전투 대형(난전)으로 전환
const WANDER_RADIUS = 2.6;       // 난전 중 배회 범위
const WANDER_SPEED = 0.9;        // 난전 중 이동 속도

const MAX_BATTLE_SECONDS = 90; // 병사들이 서로 못 만나고 떠도는 경우를 대비한 안전장치

let scene, camera, renderer, clock;
let empires = []; // {name, color, castleGroup, castleAlive, unitsTotal, flagMesh}
let units = [];   // {mesh, empireIndex, dir:Vector3, cooldown, alive}
let battleOver = false;
let elapsed = 0;
let camAngle = 0;

function makeSkyTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 2; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#4f8fd6');
  grad.addColorStop(0.55, '#a7d4f0');
  grad.addColorStop(1, '#e8f6ee');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 2, 256);
  return new THREE.CanvasTexture(canvas);
}

function makeGrassTexture() {
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#4caf50';
  ctx.fillRect(0, 0, size, size);
  for (let i = 0; i < 1400; i++) {
    ctx.globalAlpha = 0.35 + Math.random() * 0.25;
    ctx.fillStyle = Math.random() < 0.5 ? '#3f9142' : '#66c86e';
    const x = Math.random() * size, y = Math.random() * size;
    ctx.beginPath();
    ctx.arc(x, y, 1 + Math.random() * 2.2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(10, 10);
  return tex;
}

function addDecorations() {
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x7a5230, roughness: 1 });
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.9 });
  const rockMat = new THREE.MeshStandardMaterial({ color: 0x9aa0a6, roughness: 1 });

  for (let i = 0; i < 34; i++) {
    const r = 15 + Math.random() * 21;
    const a = Math.random() * Math.PI * 2;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;

    if (Math.random() < 0.65) {
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.18, 1.1, 6), trunkMat);
      trunk.position.set(x, 0.55, z);
      trunk.castShadow = true;
      scene.add(trunk);
      const leaves = new THREE.Mesh(new THREE.ConeGeometry(0.8 + Math.random() * 0.3, 1.6, 8), leafMat);
      leaves.position.set(x, 1.75, z);
      leaves.castShadow = true;
      scene.add(leaves);
    } else {
      const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.3 + Math.random() * 0.25, 0), rockMat);
      rock.position.set(x, 0.25, z);
      rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
      rock.castShadow = true;
      scene.add(rock);
    }
  }
}

function initThree() {
  scene = new THREE.Scene();
  scene.background = makeSkyTexture();
  scene.fog = new THREE.Fog(0xa7d4f0, 24, 58);

  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 120);
  camera.position.set(0, 15, 20);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const ambient = new THREE.AmbientLight(0xffffff, 0.55);
  scene.add(ambient);
  const sun = new THREE.DirectionalLight(0xfff4e0, 1.0);
  sun.position.set(10, 18, 6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -28; sun.shadow.camera.right = 28;
  sun.shadow.camera.top = 28; sun.shadow.camera.bottom = -28;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 50;
  scene.add(sun);

  // 초록 평야
  const groundGeo = new THREE.CircleGeometry(40, 48);
  const groundMat = new THREE.MeshStandardMaterial({ map: makeGrassTexture(), roughness: 0.95 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  addDecorations();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  clock = new THREE.Clock();
  animate();
}

function layoutEmpires(n) {
  const positions = [];
  for (let i = 0; i < n; i++) {
    const angle = (i / n) * Math.PI * 2;
    positions.push(new THREE.Vector3(Math.cos(angle) * CASTLE_RADIUS, 0, Math.sin(angle) * CASTLE_RADIUS));
  }
  return positions;
}

function buildCastle(color, homePos) {
  const group = new THREE.Group();
  const wallMat = new THREE.MeshStandardMaterial({ color: 0xb8bcc4, roughness: 0.85 });
  const roofMat = new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.1 });
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x2b2f36, roughness: 0.9 });

  const addShadow = (mesh) => { mesh.castShadow = true; mesh.receiveShadow = true; return mesh; };

  const keep = addShadow(new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.2, 2.2), wallMat));
  keep.position.y = 1.1;
  group.add(keep);

  // 문
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.9, 0.05), darkMat);
  door.position.set(0, 0.45, 1.13);
  group.add(door);

  // 창문
  [[-0.6, 1.6], [0.6, 1.6]].forEach(([x, y]) => {
    const win = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.05), darkMat);
    win.position.set(x, y, 1.13);
    group.add(win);
  });

  const roof = addShadow(new THREE.Mesh(new THREE.ConeGeometry(1.7, 1.4, 4), roofMat));
  roof.position.y = 2.9;
  roof.rotation.y = Math.PI / 4;
  group.add(roof);

  [[-1.4, -1.4], [1.4, -1.4], [-1.4, 1.4], [1.4, 1.4]].forEach(([x, z]) => {
    const tower = addShadow(new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.45, 2.6, 8), wallMat));
    tower.position.set(x, 1.3, z);
    group.add(tower);
    const cap = addShadow(new THREE.Mesh(new THREE.ConeGeometry(0.5, 0.8, 8), roofMat));
    cap.position.set(x, 3.0, z);
    group.add(cap);
  });

  // 깃발 (펄럭이는 애니메이션용으로 별도 그룹에 담음)
  const flagPole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.2, 6), darkMat);
  flagPole.position.y = 3.6;
  group.add(flagPole);

  const flagCloth = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.4), new THREE.MeshStandardMaterial({ color, side: THREE.DoubleSide }));
  flagCloth.position.set(0.32, 4.05, 0);
  group.add(flagCloth);

  group.position.copy(homePos);
  group.lookAt(0, group.position.y, 0);
  scene.add(group);
  return { group, flagCloth };
}

function pickWanderTarget() {
  const r = Math.random() * WANDER_RADIUS;
  const a = Math.random() * Math.PI * 2;
  return new THREE.Vector3(Math.cos(a) * r, 0.16, Math.sin(a) * r);
}

function spawnUnits(empireIndex, color, homePos, count) {
  const dirToCenter = homePos.clone().negate().normalize();
  const perRow = Math.ceil(Math.sqrt(count));
  const mat = new THREE.MeshStandardMaterial({
    color, roughness: 0.35, metalness: 0.15,
    emissive: color, emissiveIntensity: 0.18,
  });
  const geo = new THREE.SphereGeometry(0.2, 14, 12);

  // 진군 방향에 수직인 축(측면으로 대열을 펼치기 위함)
  const side = new THREE.Vector3(-dirToCenter.z, 0, dirToCenter.x);

  for (let i = 0; i < count; i++) {
    const row = Math.floor(i / perRow);
    const col = i % perRow - perRow / 2;

    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    const spawnPos = homePos.clone()
      .addScaledVector(dirToCenter, 1.8 + row * 0.55)
      .addScaledVector(side, col * 0.5);
    spawnPos.y = 0.16;
    mesh.position.copy(spawnPos);
    scene.add(mesh);

    units.push({
      mesh,
      empireIndex,
      dir: dirToCenter.clone(),
      cooldown: 0,
      alive: true,
      engaged: false,
      wanderTarget: null,
    });
  }
}

function updateLegend() {
  const legend = document.getElementById('legend');
  legend.innerHTML = empires.map((e, i) => {
    const alive = units.filter(u => u.empireIndex === i && u.alive).length;
    const dead = alive === 0;
    return `
      <div class="row ${dead ? 'dead' : ''}">
        <span class="dot" style="background:#${e.color.toString(16).padStart(6,'0')}"></span>
        <span>${e.name}: ${alive}명${dead ? ' (전멸)' : ''}</span>
      </div>`;
  }).join('');
}

function log(html, cls) {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.innerHTML = html;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function spawnBurst(position, color) {
  const burstMat = new THREE.MeshBasicMaterial({ color });
  const particles = [];
  for (let i = 0; i < 7; i++) {
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.045, 6, 6), burstMat);
    p.position.copy(position);
    scene.add(p);
    const dir = new THREE.Vector3(Math.random() - 0.5, Math.random() * 0.8 + 0.2, Math.random() - 0.5).normalize();
    particles.push({ mesh: p, dir });
  }
  const start = performance.now();
  const step = () => {
    const t = (performance.now() - start) / 450;
    if (t >= 1) {
      particles.forEach(p => scene.remove(p.mesh));
      return;
    }
    particles.forEach(p => {
      p.mesh.position.addScaledVector(p.dir, 0.045);
      p.mesh.scale.setScalar(1 - t);
    });
    requestAnimationFrame(step);
  };
  step();
}

function killUnit(u) {
  u.alive = false;
  const mesh = u.mesh;
  spawnBurst(mesh.position, mesh.material.color.getHex());
  const start = performance.now();
  const shrink = () => {
    const t = (performance.now() - start) / 200;
    if (t >= 1) {
      scene.remove(mesh);
      return;
    }
    mesh.scale.setScalar(1 - t);
    mesh.position.y = 0.16 - t * 0.16;
    requestAnimationFrame(shrink);
  };
  shrink();
}

function collapseCastle(empire) {
  empire.castleAlive = false;
  empire.castleGroup.children.forEach(child => { child.position.y -= 1.4; });
}

function resolveEliminations() {
  empires.forEach((e, i) => {
    if (!e.castleAlive) return;
    const alive = units.filter(u => u.empireIndex === i && u.alive).length;
    if (alive === 0) {
      collapseCastle(e);
      log(`🏰 ${e.name} 제국이 전멸했습니다.`);
    }
  });
}

function declareWinner(empire) {
  battleOver = true;
  if (empire) {
    log(`<span class="winner">🏆 ${empire.name} 제국 승리!</span>`, 'winner');
  } else {
    log(`<span class="winner">전군 전멸... 무승부</span>`, 'winner');
  }
  document.getElementById('status').textContent = "전쟁 종료";
}

function checkVictory() {
  const survivors = empires.filter(e => e.castleAlive);
  if (survivors.length <= 1) {
    declareWinner(survivors[0] || null);
    return;
  }
  if (elapsed > MAX_BATTLE_SECONDS) {
    // 시간 초과: 남은 병력이 가장 많은 제국이 승리
    const byUnits = survivors.map(e => ({
      e, alive: units.filter(u => u.empireIndex === empires.indexOf(e) && u.alive).length
    })).sort((a, b) => b.alive - a.alive);
    declareWinner(byUnits[0].e);
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = battleOver ? 0 : Math.min(clock.getDelta(), 0.05);

  if (dt > 0) {
    elapsed += dt;

    // 이동: 중앙으로 진군하다가, 중앙 근처에 도달하면 난전 대형으로 전환해 계속 배회하며 싸운다
    units.forEach(u => {
      if (!u.alive) return;

      if (!u.engaged) {
        u.mesh.position.addScaledVector(u.dir, UNIT_SPEED * dt);
        if (u.mesh.position.length() < ENGAGE_RADIUS) {
          u.engaged = true;
          u.wanderTarget = pickWanderTarget();
        }
      } else {
        const toTarget = u.wanderTarget.clone().sub(u.mesh.position);
        if (toTarget.length() < 0.3) {
          u.wanderTarget = pickWanderTarget();
        } else {
          u.mesh.position.addScaledVector(toTarget.normalize(), WANDER_SPEED * dt);
        }
      }

      if (u.cooldown > 0) u.cooldown -= dt;
      u.mesh.rotation.y += dt * 2;
    });

    // 충돌 판정 (서로 다른 진영끼리)
    const alive = units.filter(u => u.alive && u.cooldown <= 0);
    for (let i = 0; i < alive.length; i++) {
      const a = alive[i];
      if (!a.alive) continue;
      for (let j = i + 1; j < alive.length; j++) {
        const b = alive[j];
        if (!b.alive || a.empireIndex === b.empireIndex) continue;
        if (a.mesh.position.distanceTo(b.mesh.position) < COLLIDE_DIST) {
          const loser = Math.random() < 0.5 ? a : b;
          const winner = loser === a ? b : a;
          killUnit(loser);
          winner.cooldown = 0.35;
          break;
        }
      }
    }

    resolveEliminations();
    updateLegend();
    checkVictory();

    // 깃발 펄럭임
    empires.forEach(e => {
      if (e.flagCloth) e.flagCloth.rotation.y = Math.sin(elapsed * 3) * 0.3;
    });
  }

  // 카메라 천천히 선회 (전투가 끝나도 계속)
  camAngle += 0.0015;
  camera.position.set(Math.sin(camAngle) * 24, 15, Math.cos(camAngle) * 24);
  camera.lookAt(0, 0.5, 0);

  renderer.render(scene, camera);
}

async function loginWithGithub() {
  await supabaseClient.auth.signInWithOAuth({
    provider: 'github',
    options: { redirectTo: window.location.href, scopes: 'repo read:org' }
  });
}

async function loadEmpires() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  const githubToken = session?.provider_token || null;

  if (!githubToken) {
    document.getElementById('status').style.display = 'none';
    document.getElementById('loginGate').style.display = 'flex';
    return;
  }

  document.getElementById('status').textContent = "커밋 데이터로 병력을 편성하는 중...";

  const res = await fetch('/battle_data', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ since: "2 weeks ago", until: "now", github_token: githubToken })
  });
  const data = await res.json();

  if (data.error) {
    document.getElementById('status').textContent = "오류: " + data.error;
    return;
  }

  document.getElementById('status').textContent = "";
  initThree();

  const positions = layoutEmpires(data.empires.length);
  empires = data.empires.map((e, i) => {
    const color = COLORS[i % COLORS.length];
    const castle = buildCastle(color, positions[i]);
    return {
      name: e.name, color, castleGroup: castle.group, flagCloth: castle.flagCloth,
      castleAlive: true, unitsTotal: e.soldiers, homePos: positions[i],
    };
  });

  data.empires.forEach((e, i) => {
    const count = Math.min(e.soldiers, MAX_UNITS_PER_EMPIRE);
    spawnUnits(i, empires[i].color, positions[i], count);
  });

  updateLegend();
  log(`${empires.map(e => e.name + '(' + e.unitsTotal + '명)').join(' vs ')} 전쟁 시작! 병력이 평야 중앙으로 진군합니다.`);
}

loadEmpires();
</script>
</body>
</html>
